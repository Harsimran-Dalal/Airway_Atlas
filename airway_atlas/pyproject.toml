[project]
name = "airway-atlas"
version = "0.1.0"
description = "Explore an airport network and compare shortest-path algorithms."
authors = [{ name = "Harsimran Singh Dalal" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.8",
    "folium>=0.20.0",
    "gunicorn>=23.0.0",
    "networkx>=3.5",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "sqlparse>=0.5.3",
    "tzdata>=2025.2",
]

[project.urls]
"Author GitHub" = "https://github.com/Harsimran-Dalal"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.4",
]
